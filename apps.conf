# ==============================================================================
# apps.conf — 配置清单，dot_update.sh 和 arch-install.sh 共用
# 加东西只改这里一处，两个脚本都跟着走
# 注意：这个文件会被 source 进脚本，别写会执行的东西
# ==============================================================================

# --- .config 下要同步的项（目录或文件，加软件就加一行）---
CONFIG_APPS=(
  niri
  matugen
  fish
  kitty
  yazi
  nvim
  mpv
  btop
  fastfetch
  fuzzel
  mako
  waybar
  awob
  swayosd
  fcitx5
  starship.toml
  fontconfig
  gtk-3.0
  gtk-4.0
  dconf
  autostart
  scripts
  cava
  MangoHud
  nwg-look
  glow
  satty
  xdg-desktop-portal
  user-dirs.dirs
  user-dirs.locale
  xsettingsd
  pulse
  pavucontrol.ini
)

# --- 要同步的顶层 dotfile ---
TOP_FILES=(
  .bashrc
  .bash_profile
  .bash_logout
  .fbtermrc
  .vimrc
  .gtkrc-2.0
  .gitconfig
  .wget-hsts
)

# --- 要同步的顶层目录 ---
TOP_DIRS=(
  .vim
  .icons
  .themes
  .miyu
)

# --- 系统级配置（恢复时要 sudo；仓库里放在 etc/ 下）---
ETC_FILES=(
  /etc/sddm.conf
  /etc/sddm.conf.d/kde_settings.conf
  /etc/sddm.conf.d/locale.conf
)

# --- 壁纸目录（相对家目录；仓库里是 dotfiles/chenpi_file/wallpaper）---
WALLPAPER_DIR="chenpi_file/wallpaper"

# --- 壁纸目录里不同步进仓库的东西（软链接、缓存）---
WALLPAPER_EXCLUDES=(
  cache-niri-overview-blur-dark
)

# --- 同步 .miyu 时排除的敏感项（API key、cookie 之类）---
MIYU_EXCLUDES=(
  config
  state/daemon-launch.json
)

# --- 已知的显示管理器，DM 冲突检测用 ---
KNOWN_DMS=(
  sddm
  gdm
  lightdm
  ly
  lemurs
  lxdm
  plasmalogin
  greetd
)

# --- 备份时排除（体积大、能重建，不值得塞进 tar）---
BACKUP_EXCLUDES=(
  .config/QQ
  .config/mozilla
  .config/chromium
  .config/Code
  .config/opencode
)
